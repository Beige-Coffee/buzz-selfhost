<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recommendation mockups</title>
  <script type="module" src="./rec.ts"></script>
</head>
<body class="mk-body">
  <main class="mk-page">
    <header class="mk-top">
      <p class="label"><i></i>Mockups, not on the site</p>

        <button type="button" data-mq="add" aria-pressed="true">Add people</button>

        <button type="button" data-mq="two-factor" aria-pressed="false">Two-factor</button>
      </div>
    </div>

  </main>
