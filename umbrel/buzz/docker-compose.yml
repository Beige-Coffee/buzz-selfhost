version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: buzz_web_1
      APP_PORT: 8080

  # Setup and status page: the owner's public ID, the community's domain, and checks.
  web:
    image: python:3.13.16-alpine3.24@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
    user: "1000:1000"
    command: ["python3", "-u", "/app/setup.py"]
    volumes:
      - ${APP_DATA_DIR}/setup.py:/app/setup.py:ro
      - ${APP_DATA_DIR}/data/settings:/settings
    restart: on-failure

  # What Cloudflare Tunnel points at: http://buzz-gateway:80
  gateway:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    networks:
      default:
        aliases:
          # Container names have underscores, which aren't valid in hostnames.
          - buzz-gateway
    volumes:
      - ${APP_DATA_DIR}/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: on-failure

  relay:
    image: ghcr.io/block/buzz:sha-16eb0b6@sha256:2221d408d56af6479e9eae216cfb5a55e4346c3e8826b6176ad15f5792150ea8
    # Generates the relay's own key on first start, waits for the setup page, then runs the
    # relay. When the setup page changes the settings, it exits so the relay restarts with them.
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        key=/data/secrets/relay.env
        settings=/data/settings/relay.env
        if [ ! -s "$$key" ]; then
          umask 077
          printf 'BUZZ_RELAY_PRIVATE_KEY=%s\n' "$$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')" > "$$key.tmp"
          mv "$$key.tmp" "$$key"
        fi
        until [ -s "$$settings" ]; do
          echo "Waiting for setup: open Buzz from the Umbrel home screen."
          sleep 5
        done
        stamp=$$(stat -c %Y "$$settings")
        set -a
        . "$$key"
        . "$$settings"
        set +a
        /usr/local/bin/buzz-relay &
        pid=$$!
        trap 'kill -TERM "$$pid" 2>/dev/null || true; wait "$$pid" || true; exit 0' TERM INT
        while kill -0 "$$pid" 2>/dev/null; do
          sleep 3
          if [ "$$(stat -c %Y "$$settings" 2>/dev/null || echo 0)" != "$$stamp" ]; then
            echo "Settings changed: restarting the relay."
            kill -TERM "$$pid" || true
            wait "$$pid" || true
            exit 1
          fi
        done
        wait "$$pid"
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://buzz:${APP_BUZZ_POSTGRES_PASSWORD}@buzz_postgres_1:5432/buzz
      REDIS_URL: redis://:${APP_BUZZ_REDIS_PASSWORD}@buzz_redis_1:6379
      BUZZ_S3_ENDPOINT: http://buzz-silo:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${APP_BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${APP_BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_GIT_HOOK_HMAC_SECRET: ${APP_BUZZ_GIT_HOOK_HMAC_SECRET}
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_GIT_CONFORMANCE_PROBE: "true"
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      BUZZ_ALLOW_NIP_OA_AUTH: "true"
      BUZZ_PUSH_ENABLED: "false"
      BUZZ_PUSH_GATEWAY_DELIVERY_URL: https://push.buzz.xyz/v1/deliveries/apns
      # Cloudflare's free plan refuses uploads over 100 MB.
      BUZZ_MAX_FILE_BYTES: "100000000"
      BUZZ_MAX_VIDEO_BYTES: "100000000"
      RUST_LOG: buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info
    volumes:
      - ${APP_DATA_DIR}/data/git:/data/git
      - ${APP_DATA_DIR}/data/secrets:/data/secrets
      - ${APP_DATA_DIR}/data/settings:/data/settings:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      silo:
        condition: service_healthy
      silo-init:
        condition: service_completed_successfully
    healthcheck:
      # Healthy while it waits for setup, so the app can install before the page is filled in.
      test: ["CMD", "bash", "-c", "[ -s /data/settings/relay.env ] || exit 0; exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: on-failure

  # The free Tailscale address, only when the owner picks it on the setup page: this app's own
  # Tailscale machine, publishing the gateway with Tailscale Funnel. It never touches Umbrel's
  # Tailscale app, and it runs in userspace, so it needs no extra privileges.
  tailscale:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    # Starts Tailscale directly rather than through the image's containerboot, which gives an
    # interactive sign-in 60 seconds before restarting with a new link.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -u
        until [ -e /settings/tailscale-enabled ]; do sleep 5; done
        sock=/tmp/tailscaled.sock
        ts() { tailscale --socket="$$sock" "$$@"; }
        tailscaled --tun=userspace-networking --statedir=/var/lib/tailscale --socket="$$sock" &
        daemon=$$!
        trap 'kill -TERM "$$daemon" 2> /dev/null; wait "$$daemon"; exit 0' TERM INT
        until [ -S "$$sock" ]; do sleep 1; done
        # Waits for the sign-in with no time limit; the setup page shows the link from the status.
        ts up --hostname=buzz --accept-dns=false > /dev/null 2>&1 &
        # Reports the machine's state to the setup page, publishes the gateway with Funnel once
        # signed in, and stops when the owner switches to a domain.
        while kill -0 "$$daemon" 2> /dev/null; do
          [ -e /settings/tailscale-enabled ] || { kill -TERM "$$daemon"; wait "$$daemon"; exit 0; }
          ts status --json > /settings/tailscale-status.json.tmp 2> /dev/null &&
            mv -f /settings/tailscale-status.json.tmp /settings/tailscale-status.json
          if grep -q '"BackendState": "Running"' /settings/tailscale-status.json 2> /dev/null &&
            ! ts funnel status 2> /dev/null | grep -q buzz-gateway &&
            ! pgrep -f "funnel --bg" > /dev/null; then
            ts funnel --bg http://buzz-gateway:80 > /settings/tailscale-funnel.log 2>&1 &
          fi
          sleep 5
        done
        exit 1
    volumes:
      - ${APP_DATA_DIR}/data/tailscale:/var/lib/tailscale
      - ${APP_DATA_DIR}/data/settings:/settings
    restart: on-failure

  # Phones pair with Buzz Desktop through this service, at wss://<domain>/pair.
  pair:
    image: ghcr.io/block/buzz:sha-16eb0b6@sha256:2221d408d56af6479e9eae216cfb5a55e4346c3e8826b6176ad15f5792150ea8
    entrypoint: ["/usr/local/bin/buzz-pair-relay"]
    environment:
      BUZZ_PAIR_RELAY_BIND_ADDR: 0.0.0.0:5000
    restart: on-failure

  postgres:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    user: "1000:1000"
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: ${APP_BUZZ_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz -d buzz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: on-failure

  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    user: "1000:1000"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${APP_BUZZ_REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${APP_BUZZ_REDIS_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: on-failure

  # Uploaded files. Silo is the S3 server Block's own bundle uses.
  silo:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    user: "1000:1000"
    command: ["server", "/data"]
    networks:
      default:
        aliases:
          # Silo refuses requests to a hostname with underscores, like its container name.
          - buzz-silo
    environment:
      MINIO_ROOT_USER: ${APP_BUZZ_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${APP_BUZZ_S3_SECRET_KEY}
    volumes:
      - ${APP_DATA_DIR}/data/silo:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: on-failure

  # Creates the private bucket for uploads, then exits.
  silo-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      silo:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${APP_BUZZ_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${APP_BUZZ_S3_SECRET_KEY}
    entrypoint:
      - /bin/sh
      - -euc
      - |
        mc alias set local http://buzz-silo:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /dev/null
        mc mb --ignore-existing local/buzz-media
        mc anonymous set none local/buzz-media
    restart: on-failure
