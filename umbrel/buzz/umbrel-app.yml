manifestVersion: 1
id: buzz
storage:
  dataRoot: data
category: social
name: Buzz
version: "9e8c9fc"
tagline: Host your team's Buzz community on your Umbrel
description: >-
  Buzz is a team chat where your community lives on a relay you run. This app runs the relay on
  your Umbrel: messages, files and the member list stay on it. Members use the Buzz desktop app
  (Buzz 1.0, or Buzz 0.X) and the Buzz mobile app.


  Setup asks for two things on the app's page after install: your public ID from Buzz, which
  makes you the community's owner, and the community's address. The address is permanent:
  Buzz can't change a community's address yet, so a different address later starts a new, empty
  community.


  - Your own domain (recommended), routed to this Umbrel by the Cloudflare Tunnel app. You can
  move the community to another server later and keep it. Cloudflare decrypts the traffic between
  members and your Umbrel, and uploads are limited to 100 MB.

  - A free Tailscale address, to try it out. Members don't need Tailscale, but the address belongs
  to your Tailscale account and can't become your own domain later.


  Phones pair through the desktop app. Push notifications aren't available for self-hosted
  communities yet.
