manifestVersion: 1
id: buzz
storage:
  dataRoot: data
category: social
name: Buzz Relay
version: "9e8c9fc"
tagline: Host your team's Buzz community on your Umbrel
description: >-
  Buzz is a team chat where your community lives on a relay you run. This app runs the relay on
  your Umbrel: messages, files and the member list stay on it. Members use the Buzz app on their
  computers and phones.


  After install, open the app and sign in with the password Umbrel shows for it. The setup page
  asks for your public ID from Buzz, which makes you the community's owner, and how members reach
  the community. In every option, only members can read or post.


  - Your own domain (recommended), for a lasting community. You sign in to Cloudflare from the
  app's page and choose the domain; the app sets up its own Cloudflare tunnel and the name, with no
  router changes, and the address stays yours if you move to another server. Cloudflare handles
  HTTPS, so it can see the traffic it carries, and uploads are limited to 100 MB.

  - A free Tailscale address, for trying Buzz out. Members don't need Tailscale. The address is
  tied to your Tailscale account, so moving to your own domain later means starting over.

  - A private Tailscale network, off the internet. Every member needs the Tailscale app and
  access to your Tailscale network.


  Pick the address carefully: Buzz ties a community to its address, so a different address later
  starts a new, empty community. The old one stays stored on your Umbrel.


  Phones pair through the Buzz app on a computer. iPhones get notifications for direct messages
  and mentions through Block's push service, which passes Apple a wake-up signal, never a message.
  A setting on the app's page turns them off. Android doesn't get notifications yet.
