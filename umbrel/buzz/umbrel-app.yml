manifestVersion: 1
id: buzz
storage:
  dataRoot: data
category: social
name: Buzz
version: "16eb0b6"
tagline: Host your team's Buzz community on your Umbrel
description: >-
  Buzz is a team chat where your community lives on a relay you run. This app runs the relay on
  your Umbrel: messages, files and the member list stay on it. Members use Buzz Desktop and the
  Buzz mobile app.


  Setup needs two things, entered on the app's page after install:


  - Your public ID from Buzz Desktop, which makes you the community's owner

  - A domain you control, routed to this Umbrel by the Cloudflare Tunnel app, so members can reach
  the community from anywhere


  The domain is the community's permanent address: a different domain later starts a new, empty
  community. Cloudflare decrypts the traffic between members and your Umbrel, and uploads are
  limited to 100 MB.


  Phones pair through Buzz Desktop. Push notifications aren't available for self-hosted
  communities yet.
